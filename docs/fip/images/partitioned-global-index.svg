<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Secondary index lookup across main-table partitions</title>
  <desc id="desc">An index value routes to one non-partitioned Index Bucket. Each candidate contains the complete main-table primary key, whose partition field routes the second lookup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 24px; font-weight: 600; fill: #101828; }
      .subtitle { font-size: 13px; fill: #667085; }
      .section { font-size: 16px; font-weight: 600; fill: #101828; }
      .step { font-size: 11px; font-weight: 600; fill: #667085; }
      .node-title { font-size: 14px; font-weight: 600; fill: #344054; }
      .body { font-size: 12px; fill: #475467; }
      .small { font-size: 11px; fill: #667085; }
      .key { font-size: 12px; font-weight: 600; fill: #065F46; }
      .route { font-size: 11px; font-weight: 600; fill: #2563EB; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text class="title" x="40" y="42">Secondary index lookup across main-table partitions</text>
  <text class="subtitle" x="40" y="66">The first lookup needs only the index value; the returned primary key routes the main-table lookup.</text>

  <text class="step" x="40" y="118">01  LOOKUP KEY</text>
  <rect x="40" y="135" width="180" height="116" rx="6" fill="#EFF6FF" stroke="#84ADFF" stroke-width="1.5"/>
  <text class="node-title" x="62" y="171">Find user orders</text>
  <text class="body" x="62" y="200">user_id = 42</text>
  <text class="small" x="62" y="226">No dt value is required</text>

  <text class="step" x="290" y="94">02  GLOBAL INDEX LOOKUP</text>
  <rect x="290" y="110" width="410" height="366" rx="6" fill="#F8FAFC" stroke="#D0D5DD" stroke-width="1.5"/>
  <rect x="290" y="110" width="410" height="58" rx="6" fill="#F0FDFA"/>
  <circle cx="313" cy="136" r="5" fill="#0F766E"/>
  <text class="section" x="328" y="141">Index Table: orders__idx_user</text>
  <text class="small" x="328" y="158">Not partitioned; bucket key: user_id</text>

  <rect x="315" y="190" width="360" height="258" rx="6" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="1.5"/>
  <text class="key" x="337" y="219">Index Bucket for user_id = 42</text>
  <line x1="337" y1="234" x2="653" y2="234" stroke="#A6F4C5"/>

  <text class="body" x="337" y="260">PK = (2026-07-15, 1001)</text>
  <text class="small" x="337" y="279">partitionId 101 · cleanup only</text>
  <line x1="337" y1="293" x2="653" y2="293" stroke="#A6F4C5"/>

  <text class="body" x="337" y="319">PK = (2026-07-16, 2048)</text>
  <text class="small" x="337" y="338">partitionId 305 · cleanup only</text>
  <line x1="337" y1="352" x2="653" y2="352" stroke="#A6F4C5"/>

  <text class="body" x="337" y="378">PK = (2026-07-17, 4096)</text>
  <text class="small" x="337" y="397">partitionId 912 · cleanup only</text>
  <text class="small" x="337" y="426">Each candidate carries the complete main-table PK.</text>

  <path d="M 220 193 C 248 193, 260 236, 315 236" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#blue-arrow)"/>
  <text class="route" x="246" y="180">route by index value</text>

  <text class="step" x="790" y="94">03  MAIN-TABLE LOOKUPS</text>
  <circle cx="802" cy="126" r="5" fill="#2563EB"/>
  <text class="section" x="817" y="132">Main table: orders</text>
  <text class="small" x="817" y="151">Partitioned by dt; primary key: (dt, order_id)</text>

  <rect x="790" y="175" width="370" height="82" rx="6" fill="#F8FAFC" stroke="#D0D5DD" stroke-width="1.5"/>
  <rect x="790" y="175" width="5" height="82" rx="2.5" fill="#2563EB"/>
  <text class="node-title" x="815" y="205">Partition dt = 2026-07-15</text>
  <text class="body" x="815" y="231">Point lookup (2026-07-15, 1001)</text>

  <rect x="790" y="278" width="370" height="82" rx="6" fill="#F8FAFC" stroke="#D0D5DD" stroke-width="1.5"/>
  <rect x="790" y="278" width="5" height="82" rx="2.5" fill="#2563EB"/>
  <text class="node-title" x="815" y="308">Partition dt = 2026-07-16</text>
  <text class="body" x="815" y="334">Point lookup (2026-07-16, 2048)</text>

  <rect x="790" y="381" width="370" height="82" rx="6" fill="#F8FAFC" stroke="#D0D5DD" stroke-width="1.5"/>
  <rect x="790" y="381" width="5" height="82" rx="2.5" fill="#2563EB"/>
  <text class="node-title" x="815" y="411">Partition dt = 2026-07-17</text>
  <text class="body" x="815" y="437">Point lookup (2026-07-17, 4096)</text>

  <path d="M 675 258 C 730 258, 742 216, 790 216" fill="none" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 675 317 C 730 317, 742 319, 790 319" fill="none" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 675 376 C 730 376, 742 422, 790 422" fill="none" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="small" x="735" y="168" text-anchor="middle">route by PK.dt</text>

  <line x1="40" y1="510" x2="1160" y2="510" stroke="#EAECF0"/>
  <text class="body" x="40" y="538">One Index Bucket returns candidates from every partition; the client does not scan partitions to find the index.</text>
</svg>
